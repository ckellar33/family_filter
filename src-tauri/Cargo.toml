[package]
name = "family_filter"
version = "0.1.0"
description = "Family Filter — AppleTV parental control app (Tauri + Svelte)"
authors = ["Christopher Kellar"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "family_filter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `libs/` is its own independent Cargo workspace (a separate, standalone
# git repo embedded here as a submodule) — this is a plain path dependency
# into it, not a shared workspace member. See libs/README / the appletv-libs
# repo for why: it lets appletv-libs keep building on its own outside of
# this app (e.g. from the CLI in libs/appletv-cli).
appletv = { path = "../libs/appletv" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.99"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# TMDB lookups for the Select Filter poster grid (crate::metadata). rustls
# instead of the (default) native-tls backend so this doesn't drag OpenSSL
# cross-compilation into the iOS build already underway.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Already pulled in transitively (by reqwest); made direct so paths.rs can
# decode the `file://` URLs @tauri-apps/plugin-dialog's iOS/Android side
# hands back instead of the plain filesystem paths desktop returns.
url = "2"
# Direct Postgres connection for online.rs's read-only online-filter-library
# lookup -- rustls (not native-tls/OpenSSL) for the same cross-compilation
# reason reqwest above uses it, so this doesn't reintroduce the C-toolchain
# dependency that choice was made to avoid.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"

# tokio-postgres pulls in `whoami` (for a default connection username, unused
# here since online.rs always sets an explicit user) only as a transitive
# dependency, but Cargo unifies its features across the build -- declaring it
# here too, with `force-stub`, is enough to make that unification apply.
# Without this, whoami's apple-vendor `devicename()` branch calls the
# macOS-only SCDynamicStoreCopyComputerName symbol, missing from iOS's
# SystemConfiguration.framework, which fails the iOS link.
whoami = { version = "2", features = ["force-stub"] }

# tao 0.35.3 (transitive, via tauri-runtime-wry) hands UIKit a dangling
# pointer from its iOS scene-configuration callback -- harmless in debug (the
# autorelease pool papers over it) but an immediate crash on launch in
# release builds. Fixed upstream by tao#1245/commit f216350, not yet released
# to crates.io -- pinned to that exact commit (still version 0.35.3, so Cargo
# accepts it as a patch; the `dev` branch's later scene-lifecycle rewrite
# bumped to 0.36.0, which Cargo won't substitute for a "0.35" requirement).
# See https://github.com/tauri-apps/tao/issues/1340.
#
# swift-rs 1.0.8 (already required above) has its own separate Xcode 27 bug:
# its globalize_cdecl_symbols() release-build workaround only re-globalizes
# the consuming package's own object member, never the shared SwiftRs.o
# runtime shim every package bundles a private copy of -- so retain_object,
# release_object, string_from_bytes, and data_from_bytes stay locally-scoped
# and any real (more-than-trivial) app fails to link in release with
# "Undefined symbols" for those plus every plugin's own @_cdecl entry points.
# Fixed by swift-rs#82 (open, not yet merged/released) on top of the current
# 1.0.8 tag -- pinned to that exact commit, not a branch, since an unmerged
# PR head can move or disappear; if `cargo update` ever fails to fetch this
# rev, check whether #82 merged and switch to a released version instead.
# See https://github.com/Brendonovich/swift-rs/issues/81.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "f2163508104413ef0609178dcebdd5803b496211" }
swift-rs = { git = "https://github.com/Brendonovich/swift-rs", rev = "3788d3d2bae8e7a863b3e281a59477438e12c632" }

