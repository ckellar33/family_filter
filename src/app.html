<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!-- maximum-scale=1/user-scalable=no lock out pinch-zoom -- without
         them, WKWebView on iOS allows it, and (especially in the Simulator,
         where trackpad pinch/two-finger-scroll map directly to touch
         gestures) an accidental pinch leaves the whole app zoomed in and
         pannable in both directions, which reads as a layout bug but isn't
         one. Standard for an app-shell UI like this one, same tradeoff
         every native-feeling Capacitor/Tauri mobile app makes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Family Filter</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
