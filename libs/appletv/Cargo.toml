[package]
name = "appletv"
version = "0.1.0"
edition = "2024"
authors = ["Christopher Kellar"]
description = "AppleTV Companion / MRP / AirPlay pairing and control protocol library."

[dependencies]
tlv8 = { path = "../tlv8" }
opack = { path = "../opack" }
protobuf_lite = { path = "../protobuf_lite" }
srp = "0.6.0"
anyhow = "1.0.99"
zeroconf = "0.15.1"
futures = "0.3.31"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
chacha20poly1305 = { version = "0.10.1", features = ["alloc"] }
num-bigint = "0.4"
rand = "0.8.5"
x25519-dalek = "2.0.1"
hex = "0.4"
log = "0.4.33"
plist = "1.10.0"
