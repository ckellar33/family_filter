[package]
name = "appletv-cli"
version = "0.1.0"
edition = "2024"
authors = ["Christopher Kellar"]
description = "Interactive CLI front end for the appletv library (Companion/MRP/AirPlay pairing and control)."

[dependencies]
appletv = { path = "../appletv" }
clap = "4.5.47"
anyhow = "1.0.99"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
log = "0.4.33"
